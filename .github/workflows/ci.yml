name: CI

# AGP CI gates, run on every PR:
#   - markdown structure (markdownlint)
#   - banned-claim hygiene on public surfaces (sourced from MARKETING_CLAIMS.md)
#   - doc-drift checks (no stale paths, no old doc numbers) — hard gate
#   - informational bead-validation greps (Epic 00 acceptance criteria)
#   - code gates: TypeScript typecheck + Bun tests (Epic 04 CLI onward)
#
# The code job came online with the Epic 04 CLI scaffold. As more runtime lands
# (Epic 03 contracts, the daemon), add dep-audit / architecture steps here.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  markdownlint:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: DavidAnson/markdownlint-cli2-action@v23
        with:
          globs: |
            **/*.md
            !node_modules/**
            !**/CHANGELOG.md
          config: .markdownlint.json

  banned-claims:
    name: Banned-claim scan (public surfaces)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Scan public surfaces for v0-banned security claims
        run: bash scripts/claim-scan.sh

  doc-drift:
    # HARD GATE as of the Epic 00 closeout (AAR 008-RA-AAR-agp-planning-cleanup,
    # bead agp-5l8.10). Fails the build on any reintroduced pre-monorepo path or
    # pre-renumbering foundation-doc ID. The audit doc 007 is exempted in the
    # script (it inventories the old paths it found).
    name: Doc drift check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check for forbidden path / numbering drift
        run: bash scripts/doc-drift.sh

  bead-validation:
    # INFORMATIONAL. Runs the per-bead acceptance greps so reviewers can see at a
    # glance which Epic 00 child fixes have landed and which are still in PR. The
    # Epic 00 AAR closes when all greps PASS; the workflow stays informational
    # forever (these are bead-acceptance checks, not CI gates).
    name: Bead validation commands (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - name: Run Epic 00 contradiction-fix validation greps
        run: bash scripts/bead-validate.sh

  code:
    name: Code (typecheck + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.23"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Tests
        run: bun test

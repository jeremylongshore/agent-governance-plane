name: CI

# AGP CI gates, run on every PR:
#   - markdown structure (markdownlint)
#   - banned-claim hygiene on public surfaces (sourced from MARKETING_CLAIMS.md)
#   - doc-drift checks (no stale paths, no old doc numbers) — hard gate
#   - informational bead-validation greps (Epic 00 acceptance criteria)
#   - code gates: TypeScript typecheck + Bun tests (Epic 04 CLI onward)
#
# The code job came online with the Epic 04 CLI scaffold. As more runtime lands
# (Epic 03 contracts, the daemon), add dep-audit / architecture steps here.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  markdownlint:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: DavidAnson/markdownlint-cli2-action@v23
        with:
          globs: |
            **/*.md
            !node_modules/**
            !**/CHANGELOG.md
          config: .markdownlint.json

  banned-claims:
    name: Banned-claim scan (public surfaces)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Scan public surfaces for v0-banned security claims
        run: bash scripts/claim-scan.sh
      - name: Scan PR commit subjects (the release-notes source)
        if: github.event_name == 'pull_request'
        run: bash scripts/claim-scan.sh --commits "origin/${{ github.base_ref }}...HEAD"

  doc-drift:
    # HARD GATE as of the Epic 00 closeout (AAR 008-RA-AAR-agp-planning-cleanup,
    # bead agp-5l8.10). Fails the build on any reintroduced pre-monorepo path or
    # pre-renumbering foundation-doc ID. The audit doc 007 is exempted in the
    # script (it inventories the old paths it found).
    name: Doc drift check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check for forbidden path / numbering drift
        run: bash scripts/doc-drift.sh

  bead-validation:
    # INFORMATIONAL. Runs the per-bead acceptance greps so reviewers can see at a
    # glance which Epic 00 child fixes have landed and which are still in PR. The
    # Epic 00 AAR closes when all greps PASS; the workflow stays informational
    # forever (these are bead-acceptance checks, not CI gates).
    name: Bead validation commands (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - name: Run Epic 00 contradiction-fix validation greps
        run: bash scripts/bead-validate.sh

  code:
    name: Code (typecheck + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.23"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Lint (Biome)
        run: bunx biome lint src
      - name: Tests + coverage gate
        run: bash scripts/coverage-gate.sh

  harness:
    # Vendored @intentsolutions/audit-harness (.audit-harness/). HARD gate.
    #   verify      — fails (exit 2) if a hash-pinned policy surface changed
    #                 without a deliberate re-pin (MARKETING_CLAIMS.md, the gate
    #                 scripts, tests/TESTING.md, tests/RTM.md — see
    #                 .harness-hash-extra-patterns).
    #   escape-scan — scans the PR diff for gate-evasion patterns (lowered
    #                 coverage floor, weakened assertions, .feature edits).
    name: Audit-harness (hash-pin + escape-scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Verify hash-pinned policy surfaces
        run: scripts/audit-harness verify
      - name: Escape-scan the PR diff
        # Exclude .audit-harness/ — the vendored scanner scripts contain the very
        # pattern literals they hunt for (self-match false positives).
        # Exclude tests/features/** — .feature files are INITIAL CREATIONS in this
        # PR; integrity is enforced by the hash-verify gate above (not the diff-grep).
        # Once pinned in .harness-hash, any subsequent AI modification is caught by
        # harness verify (exit 2), which is the load-bearing integrity check.
        if: github.event_name == 'pull_request'
        run: git diff "origin/${{ github.base_ref }}...HEAD" -- . ':(exclude).audit-harness/**' ':(exclude)tests/features/**' | scripts/audit-harness escape-scan -
      - name: Gherkin lint (advisory)
        # Advisory awk-rubric check on .feature files. Not a hard gate.
        # Falls back to the harness's built-in awk rubric if gherkin-lint CLI is absent.
        continue-on-error: true
        run: scripts/audit-harness gherkin-lint --path tests/features/

  mutation:
    # INFORMATIONAL: Stryker mutation testing scoped to src/policy/engine.ts and
    # src/policy/dangerous.ts (behavior-critical, deterministic pure functions).
    # continue-on-error: true until a baseline kill rate is measured from the first
    # CI execution; a follow-on PR sets thresholds.break in stryker.config.json
    # and raises mutation.kill_rate in tests/TESTING.md to the measured floor.
    name: Mutation testing (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    needs: [code]
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.23"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run Stryker mutation tests (policy module)
        run: bash scripts/mutation-gate.sh
